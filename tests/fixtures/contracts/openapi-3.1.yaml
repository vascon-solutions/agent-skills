openapi: 3.1.0
servers:
  - url: https://api.example.test/v3
security:
  - bearerAuth: []
paths:
  /jobs:
    parameters:
      - name: x-tenant
        in: header
        required: true
        schema: { type: string }
    post:
      operationId: startJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: accepted }
  /jobs/{id}:
    get:
      operationId: getJob
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: complete }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
